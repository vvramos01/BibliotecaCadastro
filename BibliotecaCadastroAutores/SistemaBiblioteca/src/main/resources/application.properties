spring.application.name=biblioteca

# --- Aula 7: banco H2 em ARQUIVO (os dados sobrevivem ao reinício da aplicação) ---
# Obs.: "jdbc:h2:mem:..." seria memória e os dados voltariam a se perder.
spring.datasource.url=jdbc:h2:file:./data/biblioteca
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate cria e atualiza a tabela AUTOR automaticamente a partir da @Entity
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL gerado (útil para enxergar o que o Repository faz)
spring.jpa.show-sql=true
